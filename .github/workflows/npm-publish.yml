name: npm-publish @seele/memory-client

# Triggered ONLY on tags of the form `npm-publish-vX.Y.Z`. The release
# checklist (sdk/typescript/release.md) walks maintainers through
# bumping the version, merging the PR, and tagging.
#
# Requires:
#   - Repository secret NPM_AUTH_TOKEN, set once in GitHub UI.
#
# Publishes:
#   - scope @seele/memory-client to the public npm registry.

on:
  push:
    tags:
      - 'npm-publish-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for provenance; harmless to omit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'sdk/typescript/package-lock.json'

      - name: Install
        working-directory: sdk/typescript
        run: npm ci

      - name: Typecheck
        working-directory: sdk/typescript
        run: npm run lint

      - name: Test
        working-directory: sdk/typescript
        run: npm test

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      # Never echo the token. The npm publish CLI reads NODE_AUTH_TOKEN
      # from the environment; we just point it at our secret.
      - name: Publish to npm
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --access public --provenance

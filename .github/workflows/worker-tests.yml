name: worker-tests

# The Cloudflare Worker's vitest suite. This is what gates the recall
# API contract (TASK-seele-cloud-20261116-109) — a rename of a field
# in the /mem/v1/recall response must fail here, not in production.
#
# The SDK has its own workflow (npm-publish.yml) that runs on release
# tags; this one runs on every push and PR so contract regressions are
# caught before they reach a tag.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: worker unit + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
